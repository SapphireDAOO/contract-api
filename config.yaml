  # Not deployed yet.
  mainnet:
    signerKey: "${PASS}"
    rpc:
      http: "${MAIN_NET_RPC_URL}"
      ws: "${MAIN_NET_WSS}"
      dialTimeout: 10s
    urls:
      explorer: "https://basescan.org"
