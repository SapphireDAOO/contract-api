# Which network section below to use. Override with the NETWORK env var.
network: ${NETWORK}

networks:
  # Anvil/Hardhat on the host.
  local:
    # Anvil's default account; the deployment above was made with it.
    signerKey: "${LOCAL_CALLER}"
    rpc:
      http: "http://127.0.0.1:8545"
      ws: "ws://127.0.0.1:8545"
      dialTimeout: 10s
    urls:
      # A local chain has no block explorer; links fall back to the bare hash.
      explorer: ""
      checkout: "http://localhost:3000/checkout/?id="
      dashboard: "http://localhost:3000/multisig/"
      subgraph: "${END_POINT}"
      callback: "${URL}"
      discordWebhook: "${DISCORD_WEBHOOK_URL}"
    tokens:
      # Symbols clients send in paymentTokens. The zero address is the native
      # token; USDC and wBTC are the mocks from the local deployment.
      ETH:
        address: "0x0000000000000000000000000000000000000000"
        decimals: 18
      USDC:
        address: "0x2d19afC50EaaCe1CE730ab2A9a5D87712b0d4bCc"
        decimals: 6
      wBTC:
        address: "0xda21fE4Acf85E375bC9eE72C9b00D0aEF6C495C7"
        decimals: 8
    contracts:
      paymentProcessor: "0xAA845a76bf1a7e27e5e06071e2e8C8a8F4355C20"
      paymentProcessorStorage: "0x9B486c746213EcD7A1BF449E01DeB43fC8BD3834"
      simplePaymentProcessor: "0xC3bDDA2D7f231Dc48960ED61B649f971afd28010"
      multisig: "0x05c405ef0dbBfB3005bBcd35E0b1911052731A0E"
      paymentAutomation: "0x60C7b1D8b2a61aF9466a08DFC8350094d5BabfEa"
      notes: "0x8C08B086d13F50C032f6DaB86785E7a78D437Fd1"
      oracleManager: "0x457181a280b98Ba8ACc9C262d7a78e5ED2670E60"

  # Base Sepolia.
  testnet:
    signerKey: "${PASS}"
    rpc:
      http: "${TEST_NET_RPC_URL}"
      ws: "${TEST_NET_WSS}"
      dialTimeout: 10s
    urls:
      explorer: "https://sepolia.basescan.org"
