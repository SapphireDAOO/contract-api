        decimals: 18
      USDC:
        address: "0x9652aF270a39E8F63Fa801F6293DEb944FdEB5B9"
        decimals: 6
      wBTC:
        address: "0xc3a9d881A859EC02433eb0b6FaDC79F5678627b9"
        decimals: 8
    contracts:
