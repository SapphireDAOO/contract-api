# Which network section below to use. Override with the NETWORK env var.
network: testnet

networks:
  # Anvil/Hardhat on the host.
  local:
    rpc:
      http: "http://127.0.0.1:8545"
      ws: "ws://127.0.0.1:8545"
      dialTimeout: 10s
    urls:
      # A local chain has no block explorer; links fall back to the bare hash.
      explorer: ""
      checkout: "http://localhost:3000/checkout/?data="
      dashboard: "http://localhost:3000/multisig/"
      subgraph: "${END_POINT}"
      callback: "${URL}"
      discordWebhook: "${DISCORD_WEBHOOK_URL}"
    contracts:
      paymentProcessor: "0xAA845a76bf1a7e27e5e06071e2e8C8a8F4355C20"
      paymentProcessorStorage: "0x9B486c746213EcD7A1BF449E01DeB43fC8BD3834"
