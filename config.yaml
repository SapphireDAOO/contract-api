      dashboard: "https://sapphire-dao-website-six.vercel.app/multisig/"
      subgraph: "${END_POINT}"
      callback: "${URL}"
      discordWebhook: "${DISCORD_WEBHOOK_URL}"
    tokens:
      ETH:
        address: "0x0000000000000000000000000000000000000000"
        decimals: 18
      USDC:
        address: "0x41a196b1ff165419a1320f029e689a41f30c70b0"
        decimals: 6
      wBTC:
        address: "0x8cdaf12598d71cad44e91fb1c05d565a383e3dba"
        decimals: 8
    contracts:
      paymentProcessor: "0xBD1E22D0E01e941e0e730335C0D025e4a46c888a"
      paymentProcessorStorage: "0xAc7Df32b61Ba0b2F4646ee1505980b256dA8e582"
      simplePaymentProcessor: "0xa74083E440532C2E7d3D82Ca5EE1b4d944d5154B"
      multisig: "0xF859791dde7C3a121506f3f0747A067e3B70c86A"
      paymentAutomation: "0xcd7F1e411f7ed9792f61a5F3181bc354f8E26845"
      notes: "0x092722fF05A2Fe1dFeA4b8C3E6CEE3dc868D7be2"

  # Not deployed yet.
  mainnet:
    signerKey: "${PASS}"
    rpc:
      http: "${MAIN_NET_RPC_URL}"
      ws: "${MAIN_NET_WSS}"
      dialTimeout: 10s
    urls:
      explorer: "https://basescan.org"
