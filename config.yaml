# Which network section below to use. Override with the NETWORK env var.
network: ${NETWORK}

networks:
  # Anvil/Hardhat on the host.
  local:
    # Anvil's default account; the deployment above was made with it.
    signerKey: "${LOCAL_CALLER}"
    rpc:
      http: "${LOCAL_RPC_URL}"
      ws: "${LOCAL_WSS}"
      dialTimeout: 10s
    urls:
      # A local chain has no block explorer; links fall back to the bare hash.
      explorer: ""
      checkout: "http://localhost:3000/checkout/?id="
      dashboard: "http://localhost:3000/multisig/"
      subgraph: "${END_POINT}"
      callback: "${URL}"
      discordWebhook: "${DISCORD_WEBHOOK_URL}"
    tokens:
      # Symbols clients send in paymentTokens. The zero address is the native
      # token; USDC and wBTC are the mocks from the local deployment.
      ETH:
        address: "0x0000000000000000000000000000000000000000"
        decimals: 18
      USDC:
        address: "0x2d19afC50EaaCe1CE730ab2A9a5D87712b0d4bCc"
        decimals: 6
      wBTC:
        address: "0xda21fE4Acf85E375bC9eE72C9b00D0aEF6C495C7"
        decimals: 8
    contracts:
      paymentProcessor: "0xcDEf5a4084d380CAbf0AD88421843dCb1b1a1298"
      paymentProcessorStorage: "0x9209Fb3710015c3b4c780cef605322457c7C863c"
      simplePaymentProcessor: "0x75c0f4a0aF42101E64B493B71cEFEbC359B90F25"
      multisig: "0xEE79d9E7EDBEf7c927A6A58EBc2a3b4c927C1384"
      paymentAutomation: "0x8A2a192f8eCF63E5eFF22F288cDA7cef095653FF"
      notes: "0xce270FA8D222300a2148477f924669d4b3a0523e"
      oracleManager: "0xe73d6010E56BDe831321667Db88A03255e82106b"
      sweeper: "0x0E078853ef04266c5d09F9cD21DFA761134B13f6"
      wrappedNative: "0x4a1E2AB38b64a82ef43fe3fD5921E915BfA4920c"
    services:
      feeReceiver: "${FEE_RECEIVER_ADDRESS}"

  # Base Sepolia.
