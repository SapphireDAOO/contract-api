      multisig: "0x05c405ef0dbBfB3005bBcd35E0b1911052731A0E"
      paymentAutomation: "0x60C7b1D8b2a61aF9466a08DFC8350094d5BabfEa"
      notes: "0x8C08B086d13F50C032f6DaB86785E7a78D437Fd1"

